{% extends 'index.html' %}
{% load static %}
{% block title %}Список услуг{% endblock %}

{% block content %}
<div class="search_container">
    <input class="search_input" type="text" id="searchInput" 
           placeholder="Поиск объединений, соединений и частей"
           oninput="handleSearch()">
    <button class="search_bottom" onclick="handleSearch()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </button>
</div>
    
<div id="divisionsContainer" class="containers">
    {% include 'divisions_list.html' with divisions=divisions %}
</div> 

<script>
function handleSearch() {
    const query = document.getElementById('searchInput').value;
    
    fetch(`?q=${encodeURIComponent(query)}`, {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        // Отправляем запрос для обновления только части страницы
        fetch(`/get_divisions_partial/?q=${encodeURIComponent(query)}`)
            .then(r => r.text())
            .then(html => {
                document.getElementById('divisionsContainer').innerHTML = html;
            });
    });
}
</script>
<div class="cart-summary">
    <a href="{% url 'cart_detail' %}">Корзина ({{ cart_count }} товаров)</a>
</div>

{% endblock %}
