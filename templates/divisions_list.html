{% load static %}
<div class="containers">
    {% for division in divisions %}
    <div class="division-card">
        <div class="info">
            <img src="{{ division.image_url }}" alt="{{ division.name }}">
        </div>
        <div class="down">
            <p class="card-button1">{{ division.name|linebreaksbr }}</p>
            <div class="podr1">
                <a href="{% url 'order_url' id=division.id %}" class="title">Подробнее</a>
            </div>
            <form method="post" action="{% url 'add_to_cart' division.id %}" class="add-form">
                {% csrf_token %}
                <button type="submit" class="add">Добавить</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
